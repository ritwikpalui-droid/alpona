    <circle cx="32" cy="9" r="1.1"/>
    <circle cx="43.3" cy="12.7" r="1.1"/>
    <circle cx="51.3" cy="20.7" r="1.1"/>
    <circle cx="55" cy="32" r="1.1"/>
    <circle cx="51.3" cy="43.3" r="1.1"/>
    <circle cx="43.3" cy="51.3" r="1.1"/>
    <circle cx="32" cy="55" r="1.1"/>
    <circle cx="20.7" cy="51.3" r="1.1"/>
    <circle cx="12.7" cy="43.3" r="1.1"/>
